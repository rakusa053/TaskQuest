services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../dist:/var/www/html        # Expo web ビルド成果物（なくても API は動作する）
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hono-api
    restart: unless-stopped

  hono-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    env_file:
      - .env.production
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
