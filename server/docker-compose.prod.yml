services:
  caddy:
    build:
      context: ..
      dockerfile: server/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: http://163.44.110.220
    ports:
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hono-api
    restart: unless-stopped

  hono-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    env_file:
      - .env.production
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
