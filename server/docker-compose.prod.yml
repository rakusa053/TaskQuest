services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../dist:/var/www/html        # Expo web ビルド成果物
      - caddy_data:/data             # SSL 証明書の永続化
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - hono-api
    restart: unless-stopped

  hono-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    env_file:
      - .env.production
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
